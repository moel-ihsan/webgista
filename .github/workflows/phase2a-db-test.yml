name: Phase 2A database verification

on:
  push:
    branches:
      - feat/webgista-v2
      - ci/phase2d5-settings-verification-20261104
      - ci/phase2d45-final-verification-20261105
      - ci/phase3e-roi-density-20261106
    paths:
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/phase2a-db-test.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/phase2a-db-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-tests:
    name: Migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test development deployment migration guard
        run: node --test scripts/phase2d-migration-guard.test.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Start temporary stack and apply migrations
        run: supabase start

      - name: Verify targeted migration preflight on the disposable database
        run: |
          docker exec -i supabase_db_webgista-v2 psql -U postgres -d postgres \
            --set=ON_ERROR_STOP=1 --single-transaction \
            --command='SET TRANSACTION READ ONLY' --file=/dev/stdin \
            < supabase/verification/phase_2d45_deployment_preflight.sql

      - name: Verify CCTV permanent-delete contract on the disposable database
        run: |
          docker exec -i supabase_db_webgista-v2 psql -U postgres -d postgres \
            --set=ON_ERROR_STOP=1 \
            --file=/dev/stdin < supabase/verification/phase_3d1_cctv_delete_preflight.sql

      - name: Lint database functions
        run: supabase db lint --schema public,private --level error --fail-on error

      - name: Test private-config Data API least privilege
        run: node scripts/test-local-cctv-private-config-api.mjs

      - name: Run Phase 2A security tests
        run: supabase test db supabase/tests/phase_2a_security.test.sql

      - name: Run Phase 2D profile and media security tests
        run: supabase test db supabase/tests/phase_2d_profile_media.test.sql

      - name: Run Phase 2D.5 settings security tests
        run: supabase test db supabase/tests/phase_2d5_settings.test.sql

      - name: Run Phase 2E observation security tests
        run: supabase test db supabase/tests/phase_2e_observations.test.sql

      - name: Run Phase 3D.1 permanent CCTV deletion security tests
        run: supabase test db supabase/tests/phase_3d1_cctv_permanent_delete.test.sql

      - name: Run Phase 3E ROI density configuration security tests
        run: supabase test db supabase/tests/phase_3e_roi_density_config.test.sql

      - name: Verify ROI density configuration preflight on the disposable database
        run: |
          docker exec -i supabase_db_webgista-v2 psql -U postgres -d postgres \
            --set=ON_ERROR_STOP=1 --single-transaction \
            --command='SET TRANSACTION READ ONLY' --file=/dev/stdin \
            < supabase/verification/phase_3e_roi_density_preflight.sql

      - name: Verify ROI density configuration readiness on the disposable database
        run: |
          docker exec -i supabase_db_webgista-v2 psql -U postgres -d postgres \
            --set=ON_ERROR_STOP=1 --single-transaction \
            --command='SET TRANSACTION READ ONLY' --file=/dev/stdin \
            < supabase/verification/phase_3e_roi_density_readiness.sql

      - name: Validate the approved Phase 2D fixture in the disposable database
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            result="$(supabase db query "$(cat supabase/verification/create_phase_2d_test_fixture.sql)" --yes --local)"
            printf '%s\n' "$result"
            grep -Fq 'phase2d_fixture_ready' <<<"$result"
          done
          result="$(supabase db query "select case when (select count(*) from public.agencies where name = 'WebGISTA DEV — Testing' and not is_public) = 1 and (select count(*) from public.cctv_locations camera join public.agencies agency on agency.id = camera.agency_id where camera.name = 'TEST — CCTV Simpang Jambo Tape' and camera.address = 'Simpang Jambo Tape, Banda Aceh, Aceh' and camera.category = 'regular'::public.camera_category and camera.longitude = 95.330911 and camera.latitude = 5.559729 and camera.is_active and not camera.is_public and agency.name = 'WebGISTA DEV — Testing' and not agency.is_public) = 1 and not exists (select 1 from public.cctv_private_config) and not exists (select 1 from public.traffic_observations) then 'phase2d_fixture_ci_valid' else 'phase2d_fixture_ci_invalid' end" --read-only --local)"
          printf '%s\n' "$result"
          grep -Fq 'phase2d_fixture_ci_valid' <<<"$result"

      - name: Stop temporary database
        if: always()
        run: supabase stop --no-backup
