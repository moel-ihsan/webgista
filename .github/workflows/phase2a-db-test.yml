name: Phase 2A database verification

on:
  push:
    branches:
      - feat/webgista-v2
    paths:
      - "supabase/**"
      - ".github/workflows/phase2a-db-test.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/phase2a-db-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-tests:
    name: Migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Start temporary stack and apply migrations
        run: supabase start

      - name: Lint database functions
        run: supabase db lint --schema public,private --level error --fail-on error

      - name: Run Phase 2A security tests
        run: supabase test db supabase/tests/phase_2a_security.test.sql

      - name: Stop temporary database
        if: always()
        run: supabase stop --no-backup
