name: Deploy WebGISTA development database

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Select preview, apply reviewed pending migrations, or run read-only verification
        type: choice
        required: true
        default: preview
        options:
          - preview
          - apply
          - verify
          - create-test-fixture
      development_data_loss_waiver:
        description: Explicit one-time development data-loss acceptance; guard restricts the selected migration set
        type: choice
        required: true
        default: none
        options:
          - none
          - accept-dev-data-loss-for-003-004
          - accept-dev-data-loss-for-005
          - accept-dev-data-loss-for-006

permissions:
  contents: read

concurrency:
  group: webgista-dev-database
  cancel-in-progress: false

jobs:
  deploy:
    name: Dry-run and optionally apply migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: webgista-dev

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      EXPECTED_DEV_PROJECT_REF: ${{ vars.SUPABASE_DEV_PROJECT_REF }}
      APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
      DEVELOPMENT_DATA_LOSS_WAIVER: ${{ inputs.development_data_loss_waiver }}

    steps:
      - name: Verify selected branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/feat/webgista-v2" ]]; then
            echo "Select feat/webgista-v2 for deployment."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test the deployment migration guard
        run: node --test scripts/phase2d-migration-guard.test.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Verify development target and required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEVELOPMENT_DATA_LOSS_WAIVER" != "none" && "$APPLY_MIGRATIONS" != "apply" ]]; then
            echo "The development data-loss waiver is only valid for an explicit apply run."
            exit 1
          fi
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_URL" || -z "$SUPABASE_PROJECT_REF" ]]; then
            echo "Required environment secrets are missing. Configure them in the webgista-dev environment."
            exit 1
          fi
          if [[ -z "$EXPECTED_DEV_PROJECT_REF" ]]; then
            echo "SUPABASE_DEV_PROJECT_REF is missing from the webgista-dev environment variables."
            exit 1
          fi
          if [[ "$SUPABASE_PROJECT_REF" != "$EXPECTED_DEV_PROJECT_REF" ]]; then
            echo "The secret project reference does not match the configured webgista-dev target."
            exit 1
          fi
          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z]{20}$ ]]; then
            echo "The configured target does not look like a Supabase project reference."
            exit 1
          fi
          node --input-type=module -e '
            const raw = process.env.SUPABASE_DB_URL;
            let url;
            try {
              url = new URL(raw);
            } catch {
              console.error("SUPABASE_DB_URL is not a valid connection URL.");
              process.exit(1);
            }

            const validProtocol = url.protocol === "postgresql:" || url.protocol === "postgres:";
            const validPoolerHost = /^aws-[0-9]+-[a-z0-9-]+\.pooler\.supabase\.com$/.test(url.hostname);
            const validPort = url.port === "5432";
            const validDatabase = url.pathname === "/postgres";
            const expectedUsername = `postgres.${process.env.SUPABASE_PROJECT_REF}`;
            const validUsername = decodeURIComponent(url.username) === expectedUsername;

            if (!validProtocol || !validPoolerHost || !validPort || !validDatabase || !validUsername) {
              console.error("SUPABASE_DB_URL must be a Supabase Session Pooler URL on port 5432 for the expected project and postgres database.");
              process.exit(1);
            }
          '
          echo "Target reference matches the configured webgista-dev project."

      - name: Verify approved migration snapshot
        run: node scripts/phase2d-migration-guard.mjs snapshot

      - name: Verify a completed development database recovery point (read-only)
        if: ${{ (inputs.apply_migrations == 'apply' && inputs.development_data_loss_waiver == 'none') || inputs.apply_migrations == 'create-test-fixture' }}
        shell: bash
        run: |
          set -euo pipefail
          http_status="$(curl --silent --show-error --output "$RUNNER_TEMP/phase2d-backups.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/backups")"
          if [[ "$http_status" != "200" ]]; then
            project_status="$(curl --silent --show-error --output "$RUNNER_TEMP/phase2d-project.json" --write-out '%{http_code}' \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF")"
            org_status="not_checked"
            if [[ "$project_status" == "200" ]]; then
              org_slug="$(node --input-type=module - "$RUNNER_TEMP/phase2d-project.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          try {
            const body = JSON.parse(readFileSync(process.argv[2], 'utf8'));
            if (typeof body.organization_slug === 'string' && /^[a-z0-9-]+$/i.test(body.organization_slug)) process.stdout.write(body.organization_slug);
          } catch {}
          NODE
              )"
              if [[ -n "$org_slug" ]]; then
                org_status="$(curl --silent --show-error --output "$RUNNER_TEMP/phase2d-organization.json" --write-out '%{http_code}' \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                  "https://api.supabase.com/v1/organizations/$org_slug")"
              fi
            fi
            BACKUP_HTTP_STATUS="$http_status" PROJECT_HTTP_STATUS="$project_status" ORG_HTTP_STATUS="$org_status" \
              node --input-type=module - "$RUNNER_TEMP/phase2d-backups.json" "$RUNNER_TEMP/phase2d-project.json" "$RUNNER_TEMP/phase2d-organization.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const read = (path) => { try { return JSON.parse(readFileSync(path, 'utf8')); } catch { return {}; } };
          const safe = (body) => ({
            code: typeof body.code === 'string' && /^[a-z0-9_-]+$/i.test(body.code) ? body.code : null,
            missing_permissions: Array.isArray(body.missing_permissions)
              ? body.missing_permissions.filter((item) => typeof item === 'string' && /^[a-z0-9_-]+$/i.test(item))
              : [],
          });
          const backup = safe(read(process.argv[2]));
          const project = safe(read(process.argv[3]));
          const organization = read(process.argv[4]);
          const plan = ['free', 'pro', 'team', 'enterprise'].includes(organization.plan) ? organization.plan : null;
          const projectStatus = process.env.PROJECT_HTTP_STATUS;
          let cause = 'unclassified_management_api_denial';
          if (backup.missing_permissions.includes('backups_read')) cause = 'token_missing_backups_read';
          else if (projectStatus === '401') cause = 'management_token_unauthorized';
          else if (projectStatus === '403') cause = project.missing_permissions.length ? 'project_read_permission_denied' : 'project_scope_or_access_denied';
          else if (projectStatus === '200' && plan === 'free') cause = 'free_plan_has_no_automatic_backups; backup_api_denial_still_unclassified';
          else if (projectStatus === '200' && plan) cause = 'backup_endpoint_denied_despite_project_access';
          console.error(JSON.stringify({
            cause,
            backup: { http_status: Number(process.env.BACKUP_HTTP_STATUS), ...backup },
            project: { http_status: Number(projectStatus), ...project, ref_matches_configured_target: read(process.argv[3]).ref === process.env.SUPABASE_PROJECT_REF },
            organization: { http_status: process.env.ORG_HTTP_STATUS, plan },
          }));
          NODE
            exit 1
          fi
          node scripts/phase2d-migration-guard.mjs backup "$RUNNER_TEMP/phase2d-backups.json"

      - name: Inspect remote migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --remote="$SUPABASE_DB_URL" > "$RUNNER_TEMP/phase2d-migrations.txt" 2>&1
          node scripts/phase2d-migration-guard.mjs history "$RUNNER_TEMP/phase2d-migrations.txt"

      - name: Check targeted hosted schema preconditions (read-only)
        run: |
          docker run --rm -i --network host postgres:17-alpine \
            psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --single-transaction \
            --command='SET TRANSACTION READ ONLY' --file=/dev/stdin \
            < supabase/verification/phase_2d45_deployment_preflight.sql

      - name: Check CCTV private-config grants and RLS (read-only)
        run: |
          docker run --rm -i --network host postgres:17-alpine \
            psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --single-transaction \
            --command='SET TRANSACTION READ ONLY' --file=/dev/stdin \
            < supabase/verification/phase_3c_private_config_preflight.sql

      - name: Preview remote migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --dry-run --remote="$SUPABASE_DB_URL" 2>&1 | tee "$RUNNER_TEMP/phase2d-dry-run.txt"
          node scripts/phase2d-migration-guard.mjs dry-run \
            "$RUNNER_TEMP/phase2d-migrations.txt" "$RUNNER_TEMP/phase2d-dry-run.txt"

      - name: Require explicit apply selection
        if: ${{ inputs.apply_migrations != 'apply' }}
        run: echo "Preview complete. No migrations were applied. Re-run manually and select apply after reviewing the dry-run."

      - name: Require migration 007 as the sole pending migration
        if: ${{ inputs.apply_migrations == 'apply' }}
        run: node scripts/phase2d-migration-guard.mjs phase3c-private-config "$RUNNER_TEMP/phase2d-migrations.txt"

      - name: Validate and record the explicit development-only backup waiver
        if: ${{ inputs.apply_migrations == 'apply' && inputs.development_data_loss_waiver != 'none' }}
        shell: bash
        run: |
          set -euo pipefail
          waiver_result="$(node scripts/phase2d-migration-guard.mjs waiver "$RUNNER_TEMP/phase2d-migrations.txt")"
          printf '%s\n' "$waiver_result"
          {
            echo '## One-time development backup waiver'
            echo
            echo '- Explicit workflow input accepted for this apply run.'
            echo '- Target is restricted to the verified `webgista-dev` project and `feat/webgista-v2` branch.'
            echo "- Selected waiver: $DEVELOPMENT_DATA_LOSS_WAIVER. The operator explicitly accepts development data loss; this path does not verify a backup."
            echo '- The migration hash, project, branch, and exact pending-set guards still apply.'
            echo "- Guard result: $waiver_result"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply migrations to webgista-dev
        if: ${{ inputs.apply_migrations == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/phase2d-migration-guard.mjs snapshot
          supabase migration list --remote="$SUPABASE_DB_URL" > "$RUNNER_TEMP/phase2d-migrations-before-apply.txt" 2>&1
          node scripts/phase2d-migration-guard.mjs history "$RUNNER_TEMP/phase2d-migrations-before-apply.txt"
          node scripts/phase2d-migration-guard.mjs phase3c-private-config "$RUNNER_TEMP/phase2d-migrations-before-apply.txt"
          docker run --rm -i --network host postgres:17-alpine \
            psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --single-transaction \
            --command='SET TRANSACTION READ ONLY' --file=/dev/stdin \
            < supabase/verification/phase_2d45_deployment_preflight.sql
          docker run --rm -i --network host postgres:17-alpine \
            psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --single-transaction \
            --command='SET TRANSACTION READ ONLY' --file=/dev/stdin \
            < supabase/verification/phase_3c_private_config_preflight.sql
          supabase db push --dry-run --remote="$SUPABASE_DB_URL" 2>&1 | tee "$RUNNER_TEMP/phase2d-dry-run-before-apply.txt"
          node scripts/phase2d-migration-guard.mjs dry-run \
            "$RUNNER_TEMP/phase2d-migrations-before-apply.txt" "$RUNNER_TEMP/phase2d-dry-run-before-apply.txt"
          supabase db push --yes --remote="$SUPABASE_DB_URL"

      - name: Create the explicitly approved Phase 2D test fixture
        if: ${{ inputs.apply_migrations == 'create-test-fixture' }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(supabase db query "$(cat supabase/verification/create_phase_2d_test_fixture.sql)" --yes --remote="$SUPABASE_DB_URL")"
          printf '%s\n' "$result"
          if ! grep -q 'phase2d_fixture_ready' <<<"$result"; then
            echo "Fixture preconditions failed; no test rows were created. Review the exact-name preflight and migration history."
            exit 1
          fi

      - name: Verify remote migration history after apply
        if: ${{ inputs.apply_migrations == 'apply' || inputs.apply_migrations == 'verify' || inputs.apply_migrations == 'create-test-fixture' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --remote="$SUPABASE_DB_URL" > "$RUNNER_TEMP/phase2d-migrations-after.txt" 2>&1
          if [[ "${{ inputs.apply_migrations }}" == "apply" ]]; then
            node scripts/phase2d-migration-guard.mjs applied "$RUNNER_TEMP/phase2d-migrations-after.txt"
          else
            node scripts/phase2d-migration-guard.mjs history "$RUNNER_TEMP/phase2d-migrations-after.txt"
          fi

      - name: Verify installed security and aggregate readiness (read-only)
        if: ${{ inputs.apply_migrations == 'apply' || inputs.apply_migrations == 'verify' || inputs.apply_migrations == 'create-test-fixture' }}
        shell: bash
        run: supabase db query "$(cat supabase/verification/phase_2d_hosted_readiness.sql)" --read-only --remote="$SUPABASE_DB_URL"

      - name: Verify targeted schema after migration (read-only)
        if: ${{ inputs.apply_migrations == 'apply' || inputs.apply_migrations == 'verify' }}
        run: |
          docker run --rm -i --network host postgres:17-alpine \
            psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --single-transaction \
            --command='SET TRANSACTION READ ONLY' --file=/dev/stdin \
            < supabase/verification/phase_2d45_deployment_preflight.sql

      - name: Verify CCTV private-config privileges after migration (read-only)
        if: ${{ inputs.apply_migrations == 'apply' || inputs.apply_migrations == 'verify' }}
        run: |
          docker run --rm -i --network host postgres:17-alpine \
            psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --single-transaction \
            --command='SET TRANSACTION READ ONLY' --file=/dev/stdin \
            < supabase/verification/phase_3c_private_config_preflight.sql
